name: 품질 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm review:build
      - run: pnpm build:problems
      - run: pnpm lint:problems
      - run: pnpm validate:problems
      - run: pnpm test
      - name: 확장 기능 패키지 생성
        run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: yukicoder-ko-extension
          path: dist/
          if-no-files-found: error
          include-hidden-files: false
