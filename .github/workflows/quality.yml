name: 품질 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Use committed fixtures/publication data only; never add downloads from
      # live yukicoder here or in scripts invoked by GitHub Actions.
      # Refresh source data locally and commit the offline publication data.
      # lint:problems uses GITHUB_ACTIONS=true to skip local input-format style
      # rules; HTML syntax validation and the remaining checks still run.
      - run: pnpm check
      - run: pnpm review:smoke
      - name: 확장 기능 패키지 생성
        run: pnpm package:built
      - uses: actions/upload-artifact@v4
        with:
          name: yukicoder-ko-extension
          path: |
            dist/extension/
            dist/collector/
            dist/archives/
          if-no-files-found: error
          include-hidden-files: false
