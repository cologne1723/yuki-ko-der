name: 문제 번역 배포

on:
  push:
    branches: [main]
    paths:
      - "problem-translations/**"
      - "packages/translation-core/**"
      - "tools/audit/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "README.md"
      - ".github/workflows/publish-problem-translations.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 번역 HTML 및 실제 원문 검증
        run: pnpm verify:problems
      - name: 문제 Markdown 컴파일
        run: pnpm build:problems
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/problems
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
