version: 1
locale: ko
entries:
  - id: paken-club
    source: [パ研]
    preferred: 컴퓨터동아리
    forbidden: [파켄, 파研]
    kind: proper_noun
    note: 사용자가 확정한 단체명 번역이다. パ研은 컴퓨터동아리로 쓴다.
